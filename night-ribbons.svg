<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" fill="none">
  <defs>
    <path id="turn" d="M652-80 331 157Q300 181 330 207L902 691"/>
    <!-- Parallel colour bands: purple on the inside, then red, yellow, blue. -->
    <g id="ribbon" stroke-linecap="round" stroke-linejoin="round">
      <use href="#turn" stroke="#426cff" stroke-width="14" opacity=".08"/>
      <use href="#turn" stroke="#6984ff" stroke-width="9" opacity=".12"/>
      <use href="#turn" x="-2.4" stroke="#3485ff" stroke-width="2.6"/>
      <use href="#turn" x="-.8" stroke="#ffe582" stroke-width="2.1"/>
      <use href="#turn" x=".8" stroke="#ff626f" stroke-width="2.1"/>
      <use href="#turn" x="2.4" stroke="#b491ff" stroke-width="2.4"/>
    </g>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity=".12"/>
      <stop offset=".18" stop-color="white"/>
      <stop offset=".68" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade-mask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
  </defs>
  <g mask="url(#fade-mask)" opacity="1"><use href="#ribbon" x="0" y="0" opacity="1"/><use href="#ribbon" x="29" y="-8" opacity="0.92"/><use href="#ribbon" x="58" y="-16" opacity="0.78"/><use href="#ribbon" x="87" y="-24" opacity="0.62"/><use href="#ribbon" x="116" y="-32" opacity="0.42"/></g>
</svg>
